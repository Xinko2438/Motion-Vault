<dialog id="addDialog" class="add-dialog" aria-labelledby="addTitle"><div class="dialog-top"><p id="addTitle">添加一条参考</p><button class="close-btn" data-close="addDialog" aria-label="关闭添加参考">×</button></div><div class="form-body"><div class="capture-options"><button class="capture-option" id="startRecordBtn"><strong>录制网页</strong><span>静音录制，最长 2 分钟</span></button><button class="capture-option" id="importBtn"><strong>导入视频或截图</strong><span>选择本地视觉片段</span></button></div><input id="fileInput" type="file" accept="video/mp4,video/webm,image/png,image/jpeg,image/webp" hidden><p>记录和媒体保存到本机 Workspace。系统会由你选择要录制的标签页或窗口。</p><a class="download" href="http://127.0.0.1:4380/app#design-references" target="_blank" rel="noopener">仅保存网址，或管理已有参考 ↗</a></div></dialog>
<dialog id="saveDialog" class="add-dialog" aria-labelledby="saveTitle"><div class="dialog-top"><p id="saveTitle">保存捕获的参考</p><button class="close-btn" data-close="saveDialog" aria-label="关闭保存窗口">×</button></div><form class="form-body" id="saveForm"><div id="pendingMedia"></div><label for="captureTitle">名称</label><input id="captureTitle" required maxlength="180" placeholder="例如：产品页滚动展开"><label for="captureSource">来源网址（选填）</label><input id="captureSource" type="url" placeholder="https://"><label for="captureKind">交互类型</label><select id="captureKind"><option value="other">其他</option><option value="scroll">滚动</option><option value="transition">转场</option><option value="hover">悬停</option><option value="text">文字</option><option value="layout">布局</option></select><p id="saveStatus" role="status">保存不会自动标记为喜欢或已选定。</p><a id="downloadCapture" class="download" download="motion-reference.webm">下载原文件</a><div class="form-actions"><button type="button" class="quiet" data-close="saveDialog">取消</button><button class="primary" id="saveCaptureBtn" type="submit">保存到 Workspace</button></div></form></dialog>
<div class="recording-island" id="recordingIsland" role="status"><span class="record-dot"></span><span>正在录制</span><span class="rec-time" id="recordTimer">00:00</span><button class="quiet" id="stopRecordBtn">停止并预览</button></div>
