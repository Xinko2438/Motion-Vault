/* Scoped interaction repairs: prose and code outside the effect remain selectable. */
#modalArchiveBtn{margin-left:auto;margin-right:8px}.toolbar .tabs{min-width:0}.toolbar-actions{flex-shrink:0}.meta>span{min-width:0}.archive-btn{flex-shrink:0}.stage[data-mode=drag]{touch-action:none}.vault-dragging,.vault-dragging *{user-select:none!important;-webkit-user-select:none!important}.detail-stage{user-select:none;-webkit-user-select:none}.doc-content,.detail-copy p{user-select:text;-webkit-user-select:text}

/* One gallery with shared collection, review and archive views. */
[hidden]{display:none!important}
.view-tabs{display:flex;align-items:center;gap:25px;min-height:36px;margin:0 0 12px}
.view-tabs>button{border:0;background:none;color:var(--muted);font-size:12px;padding:5px 0;white-space:nowrap}
.view-tabs>button[aria-pressed=true]{color:var(--text);font-weight:600}
.view-tabs>button span{font-size:10px;margin-left:4px;font-variant-numeric:tabular-nums;color:var(--muted)}
.view-tabs .review-export{margin-left:auto;font-size:11px}
.collect-btn{margin-left:auto;color:var(--accent);font-size:10px;padding:2px 5px;flex-shrink:0}
.collect-btn+.archive-btn{margin-left:0}
.meta .archive-btn{white-space:nowrap}
#modalCollectBtn{margin-left:auto}
#modalCollectBtn:not([hidden])+#modalArchiveBtn{margin-left:2px}
.local-source-frame{position:absolute;inset:0;width:1100px;height:670px;border:0;transform-origin:0 0;background:var(--paper)}
.private-review{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.private-review label{display:flex;justify-content:space-between;gap:16px;font-size:11px;color:var(--muted)}
.private-review label span{font-size:10px;text-align:right}
.private-review textarea{display:block;width:100%;min-height:65px;resize:vertical;padding:8px;border:1px solid var(--line);background:var(--panel);font-size:12px;border-radius:4px;margin-top:7px;user-select:text;-webkit-user-select:text}
.export-box{padding:20px}
.export-box textarea{width:100%;height:320px;background:var(--panel);border:1px solid var(--line);padding:12px;font:11px/1.5 monospace;resize:vertical}
.card:hover .preview-badge{opacity:1}
.card:focus-within{scroll-margin-top:20px}
/* Explicit media/code switch; no second gallery or overlay intercepts the pointer. */
.preview-modes{display:inline-flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:7px;background:color-mix(in srgb,var(--surface) 30%,transparent);flex-shrink:0}
.preview-modes button{border:0;border-radius:4px;background:transparent;padding:5px 10px;font-size:11px;line-height:1.4;white-space:nowrap;color:var(--muted)}
.preview-modes button[aria-pressed=true]{background:var(--panel);color:var(--text);box-shadow:0 1px 3px #17231812}
.preview-modes button:hover{color:var(--text)}
.caption{align-items:center;flex-wrap:wrap}.caption h2{flex:1;min-width:80px}.caption-controls{display:flex;align-items:center;gap:10px;margin-left:auto}.card-preview-modes button{padding:4px 7px}
.source-loading{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);font-size:11px;white-space:nowrap;padding:5px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--muted);pointer-events:none}
.local-source-frame{pointer-events:auto}
@media(max-width:580px){.toolbar-actions{justify-content:space-between;padding:8px 0}.preview-modes button{padding:5px 9px}.toolbar-actions .count{margin-left:0}}
@media(max-width:580px){.view-tabs{gap:20px;flex-wrap:wrap}.view-tabs .review-export{font-size:10px}.view-tabs>button{font-size:11px}.private-review label{flex-wrap:wrap;gap:5px}}

/* Collection actions stay on the card; no second management page. */
.collect-btn{white-space:nowrap}.collect-btn[data-secondary=true]{color:var(--muted)}
.implementation-origin{margin-top:5px;font-size:11px;line-height:1.5;color:var(--muted)}
.collection-state{display:inline-block;margin-right:12px;color:var(--text);font-weight:600}
.meta{flex-wrap:wrap}.meta>span{flex:1 1 70px}.meta .collect-btn,.meta .archive-btn,.meta .bookmark{flex:0 0 auto}
@media(max-width:580px){.dialog-top{gap:6px;flex-wrap:wrap}.dialog-top .quiet{white-space:nowrap}.dialog-top>div{min-width:100%;font-size:10px}.meta{gap:6px}}
</style>

<body>
<div class="shell">
<header class="top"><a class="brand" href="motion-vault.html"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>motion vault</a><div class="actions"><span class="hub-status" id="hubStatus">连接中</span><button class="primary" id="addBtn">＋ 添加参考</button></div></header>
<main>
<section class="intro"><div><h1>Motion Library<span>.</span></h1><p>值得停留的交互，留给下一次创作。</p></div><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="searchInput" type="search" aria-label="搜索名称、用途或设计思路" placeholder="搜索名称、用途或设计思路"></label></section>
<nav class="view-tabs" id="viewTabs" aria-label="参考状态"><button data-view="library" aria-pressed="true">正式 <span id="formalCount">0</span></button><button data-view="pending" id="pendingToggle" aria-pressed="false">预选 <span id="pendingCount">0</span></button><button data-view="hidden" id="hiddenToggle" aria-pressed="false">已下架 <span id="hiddenCount">0</span></button><button class="quiet review-export" id="exportReview" hidden>导出私人审查</button></nav>
<div class="toolbar">
<nav id="sceneTabs" class="tabs" aria-label="按用途浏览"></nav>
<div class="toolbar-actions">
<button class="quiet" id="savedToggle" aria-pressed="false">书签</button><details class="more"><summary aria-label="更多操作">···</summary><div class="more-panel"><button id="themeBtn">切换明暗</button><button id="exportPublic">导出正式清单</button><a href="motion-vault-catalog.json" target="_blank" rel="noopener">Agent 目录 ↗</a></div></details><span class="count" id="resultCount" aria-live="polite"></span>
</div></div>
<nav id="taskTabs" class="task-tabs" aria-label="具体设计任务" hidden></nav><p id="notice" role="status"></p><section id="grid" class="motion-grid" aria-label="设计参考"></section>
</main>
<footer class="bottom"><span>本地实现 · 设计拆解 · 同版本预览</span><a href="http://127.0.0.1:4380/app#design-references" target="_blank" rel="noopener">采集与媒体管理 ↗</a></footer>
</div>
<dialog id="modal" aria-labelledby="modalTitle">
<header class="dialog-top"><div><span id="modalState" class="collection-state"></span><span id="modalSource"></span><span class="revision" id="modalRevision"></span></div><button class="quiet" id="modalCollectBtn" hidden>提拔为正式</button><button class="quiet" id="modalArchiveBtn">下架</button><button class="close-btn" id="closeBtn" aria-label="关闭详情">×</button></header>
<div class="detail-layout">
<section class="preview-column"><div class="detail-stage" id="modalStage"></div><div class="detail-controls">
<div class="preview-modes" id="detailModes" role="group" aria-label="详情预览方式"><button type="button" id="runPreview" aria-pressed="true" title="查看轻量预览">预览</button><button type="button" id="runLocal" aria-pressed="false" title="运行这条参考的本地代码，保留真实鼠标交互">实时交互</button></div>
<span id="previewLabel">本地可交互实现</span><label>速度 <input id="playbackRate" aria-label="时间线播放速度" type="range" min=".25" max="2" value="1" step=".25"><output id="rateValue">1×</output></label><button class="quiet" id="replayBtn">重播</button><a id="runAlone" target="_blank" rel="noopener">独立运行 ↗</a>
</div></section>
<section class="detail-copy"><div id="modalScene" class="eyebrow"></div><h2 id="modalTitle"></h2><p id="modalDesc"></p><nav class="doc-tabs" aria-label="参考资料"><button data-section="design" aria-selected="true">设计思路</button><button data-section="implementation">实现资料</button><button data-section="provenance">来源与差异</button></nav><div class="doc-content" id="docContent" aria-live="polite"></div><div class="agent-access"><button class="quiet" id="copyAgent">复制 Agent 读取指令</button><a id="sourceLink" target="_blank" rel="noopener noreferrer">查看原作 ↗</a></div><div class="private-review" id="privateReview" hidden><label for="reviewNote">私人备注 <span id="storageStatus" role="status">自动保存</span></label><textarea id="reviewNote" maxlength="3000" placeholder="记录你的判断"></textarea></div></section>
</div></dialog>
<dialog id="exportDialog" aria-label="私人审查导出"><header class="dialog-top">私人审查记录<button class="close-btn" id="closeExport" aria-label="关闭审查导出">×</button></header><div class="export-box"><textarea id="exportText" readonly aria-label="审查 JSON"></textarea><button class="quiet" id="downloadReview">下载审查 JSON</button></div></dialog>
<dialog id="addDialog" class="add-dialog" aria-labelledby="addTitle"><div class="dialog-top"><p id="addTitle">添加一条参考</p><button class="close-btn" data-close="addDialog" aria-label="关闭添加参考">×</button></div><div class="form-body"><div class="capture-options"><button class="capture-option" id="startRecordBtn"><strong>录制网页</strong><span>静音录制，最长 2 分钟</span></button><button class="capture-option" id="importBtn"><strong>导入视频或截图</strong><span>选择本地视觉片段</span></button></div><input id="fileInput" type="file" accept="video/mp4,video/webm,image/png,image/jpeg,image/webp" hidden><p>记录和媒体保存到本机 Workspace。系统会由你选择要录制的标签页或窗口。</p><a class="download" href="http://127.0.0.1:4380/app#design-references" target="_blank" rel="noopener">仅保存网址，或管理已有参考 ↗</a></div></dialog>

window.addEventListener('pointerup',e=>{
 const p=active;if(!p)return;p.held=false;p.down=null;
 queueMicrotask(()=>{if(active!==p||p.stage===$('modalStage')&&$('modal').open)return;const r=(p.stage.closest('.card')||p.stage).getBoundingClientRect();if(e.pointerType==='mouse'&&(e.clientX<r.x||e.clientX>r.right||e.clientY<r.y||e.clientY>r.bottom))stop();});
},true);
window.addEventListener('pointercancel',stop);
window.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')lastPoint={x:e.clientX,y:e.clientY};},{passive:true});
document.addEventListener('focusin',e=>{if(active&&active.stage!==$('modalStage')&&!e.composedPath().includes(active.stage))stop();});
window.addEventListener('storage',e=>{
 try{
  if(e.key===CURATION_KEY)curation=parseCuration(e.newValue);
  else if(e.key===REVIEW_KEY)review=parseReview(e.newValue);
  else if(e.key===BOOKMARK_KEY)saved=readBookmarks();else return;
  if($('modal').open){gridDirty=true;updateDetailState();if(e.key===REVIEW_KEY&&detail&&document.activeElement===$('reviewNote')&&noteDrafts.has(String(detail.id)))$('reviewNote').value=noteDrafts.get(String(detail.id));}
  else render();
 }catch{notice('记录更新未能读取，保留当前内容。');}
});

document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stop();previewMedia.suspend();return;}resumePreviewMedia();if(detail&&$('modal').open){replay();return;}
 if(lastPoint&&!document.querySelector('dialog[open]')){
  const card=document.elementFromPoint(lastPoint.x,lastPoint.y)?.closest('.card'),stage=card?.querySelector('.stage'),it=items.find(i=>String(i.id)===card?.dataset.id);
  if(it)start(stage,it,{clientX:lastPoint.x,clientY:lastPoint.y,pointerType:'mouse'});
 }
});
window.addEventListener('focus',()=>{
 if(!lastPoint||document.hidden||document.querySelector('dialog[open]'))return;
 const card=document.elementFromPoint(lastPoint.x,lastPoint.y)?.closest('.card'),it=items.find(i=>String(i.id)===card?.dataset.id);
 if(it)start(card.querySelector('.stage'),it,{clientX:lastPoint.x,clientY:lastPoint.y,pointerType:'mouse'});
});
window.VaultRefreshHub=async()=>{
 try{
  const r=await fetch('http://127.0.0.1:4380/api/design-references',{signal:AbortSignal.timeout(4000)});if(!r.ok)throw new Error('Hub unavailable');
  const d=await r.json(),extra=(d.items||[]).map(x=>{
   const id=x.media?.previewAssetId||x.media?.originalAssetId;
   return{id:'hub-'+x.id,title:x.title,uses:[],source_kind:'capture',source_url:x.sourceUrl,desc:x.media?.message||'保留来源的媒体参考',media_kind:x.media?.mediaKind||'video',media_url:id?'http://127.0.0.1:4380/api/design-references/'+encodeURIComponent(x.id)+'/media/'+encodeURIComponent(id):'',preview_mode:'auto'};
  });
  items=[...baseItems,...extra];$('hubStatus').textContent='Workspace 已连接';if(extra.length){if($('modal').open)gridDirty=true;else render();}
 }catch{$('hubStatus').textContent='本地参考目录';}
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open]')&&active){const card=active.stage.closest('.card');if(card)card.dataset.previewPaused='true';stop();}});

window.HybridVault={release:'formal',items:()=>items,stop,open:openById,active:()=>active?{id:active.it.id,kind:active.stage.dataset.previewKind}:null};

if(initialURL.searchParams.has('v')){initialURL.searchParams.delete('v');history.replaceState({view},'',initialURL);}
tabs();render();if(curationError)notice(curationError);window.VaultRefreshHub();

(()=>{const HUB_URL='http://127.0.0.1:4380';const STATE={recorder:null,stream:null,pending:null,recordSeconds:0,recordTimerInterval:null};const notify=window.VaultNotice;const refreshHub=window.VaultRefreshHub;async function request(url,options={}){const r=await fetch(HUB_URL+url,{...options,signal:options.signal||AbortSignal.timeout(120000)});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'请求失败：'+r.status);return d}

function prepareCapture(blob,name='网页动效录制'){if(blob.size>150*1024*1024){notify('文件超过 150 MB，请裁剪后再导入。');return}if(STATE.pending)URL.revokeObjectURL(STATE.pending.url);STATE.pending={blob,url:URL.createObjectURL(blob),requestId:crypto.randomUUID(),recordId:null};document.querySelector('#captureTitle').value=name;document.querySelector('#captureSource').value='';document.querySelector('#captureKind').value='other';document.querySelector('#saveStatus').textContent='保存不会自动标记为喜欢或已选定。';const media=document.createElement(blob.type.startsWith('image/')?'img':'video');media.id='pendingPreview';media.src=STATE.pending.url;if(media.tagName==='VIDEO'){media.controls=true;media.muted=true}else media.alt='待保存截图';document.querySelector('#pendingMedia').replaceChildren(media);const download=document.querySelector('#downloadCapture');download.href=STATE.pending.url;download.download=blob.name||'motion-reference.webm';document.querySelector('#addDialog').close();document.querySelector('#saveDialog').showModal()}
async function saveCapture(event){event.preventDefault();if(!STATE.pending)return;const btn=document.querySelector('#saveCaptureBtn');if(btn.disabled)return;btn.disabled=true;const pending=STATE.pending;const status=document.querySelector('#saveStatus');status.textContent='正在保存，请保留此窗口…';try{if(!pending.recordId){const result=await request('/api/design-references',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.querySelector('#captureTitle').value.trim(),sourceUrl:document.querySelector('#captureSource').value.trim()||undefined,kind:document.querySelector('#captureKind').value,location:pending.blob.name?'本地导入':'浏览器录制',saveRequestId:pending.requestId})});pending.recordId=result.reference.id}await request('/api/design-references/'+encodeURIComponent(pending.recordId)+'/media',{method:'PUT',headers:{'Content-Type':pending.blob.type||'application/octet-stream'},body:pending.blob});document.querySelector('#saveDialog').close();notify('已保存到 Workspace。媒体加工状态可在详情中查看。');await refreshHub()}catch(e){status.textContent='保存未完成：'+e.message+'。可重试，或下载原文件。'}finally{btn.disabled=false}}
function stopRecording(){if(STATE.recorder?.state==='recording')STATE.recorder.stop();STATE.stream?.getTracks().forEach(t=>t.stop())}
async function startScreenRecord(){if(!navigator.mediaDevices?.getDisplayMedia||typeof MediaRecorder==='undefined'){notify('当前环境不支持录屏，请在桌面 Chrome 的本机页面使用，或导入已有视频。');return}try{STATE.stream=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser'},audio:false});const chunks=[];const options=MediaRecorder.isTypeSupported('video/webm')?{mimeType:'video/webm'}:{};const recorder=new MediaRecorder(STATE.stream,options);STATE.recorder=recorder;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{clearInterval(STATE.recordTimerInterval);STATE.stream.getTracks().forEach(t=>t.stop());document.querySelector('#recordingIsland').classList.remove('active');prepareCapture(new Blob(chunks,{type:recorder.mimeType||'video/webm'}))};STATE.stream.getVideoTracks()[0].onended=stopRecording;recorder.start();STATE.recordSeconds=0;document.querySelector('#recordTimer').textContent='00:00';document.querySelector('#addDialog').close();document.querySelector('#recordingIsland').classList.add('active');STATE.recordTimerInterval=setInterval(()=>{STATE.recordSeconds++;document.querySelector('#recordTimer').textContent=String(Math.floor(STATE.recordSeconds/60)).padStart(2,'0')+':'+String(STATE.recordSeconds%60).padStart(2,'0');if(STATE.recordSeconds>=120)stopRecording()},1000)}catch(e){STATE.stream?.getTracks().forEach(t=>t.stop());if(!['AbortError','NotAllowedError'].includes(e.name))notify('未能启动录屏：'+e.message)}}

const byId=id=>document.getElementById(id);

byId('startRecordBtn').addEventListener('click',startScreenRecord);byId('stopRecordBtn').addEventListener('click',stopRecording);
byId('importBtn').addEventListener('click',()=>byId('fileInput').click());byId('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)prepareCapture(f,f.name.replace(/\.[^.]+$/,''));e.target.value=''});
byId('saveForm').addEventListener('submit',saveCapture);
window.addEventListener('pagehide',()=>{stopRecording();if(STATE.pending)URL.revokeObjectURL(STATE.pending.url)});

})();</script>
